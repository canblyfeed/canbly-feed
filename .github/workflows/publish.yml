name: 인스타 자동 발행
on:
  schedule:
    - cron: '0 11 * * *'   # 매일 20:00 (한국 시간). GitHub 사정으로 몇 분~수십 분 늦을 수 있음
  workflow_dispatch:
    inputs:
      date:
        description: '발행할 날짜 (YYYY-MM-DD, 비우면 오늘)'
        required: false
      dry_run:
        description: 'true면 실제 발행 없이 점검만'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          POST_DATE: ${{ github.event.inputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python3 scripts/publish.py
      - name: 발행 기록 저장
        run: |
          git config user.name "canbly-bot"
          git config user.email "canbly-bot@users.noreply.github.com"
          git add posts/*/published.json || true
          git diff --cached --quiet || (git commit -m "발행 기록" && git push)
