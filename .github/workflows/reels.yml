name: 인스타 릴스 자동 발행
on:
  # 월·수·금 23:00 (한국 시간). reels/<날짜>/approved.txt(캔블리님 허락)가 있는 편만 올라간다. GitHub 사정으로 몇 분~수십 분 늦을 수 있음
  schedule:
    - cron: '0 14 * * 1,3,5'
  push:
    paths: ['.github/dryrun-reel.txt', 'reels/*/approved.txt']   # dryrun-reel.txt: 점검만 / approved.txt: 23시 이후 허락이면 바로 발행
  workflow_dispatch:
    inputs:
      date:
        description: '발행할 날짜 (YYYY-MM-DD, 비우면 오늘)'
        required: false
      dry_run:
        description: 'true면 업로드·처리까지만 점검하고 발행하지 않음'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          POST_DATE: ${{ github.event.inputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null | grep -q dryrun-reel.txt; then
              export DRY_RUN=true POST_DATE=$(head -1 .github/dryrun-reel.txt | tr -d '[:space:]'); echo DRY_LOG=1 >> $GITHUB_ENV
            else
              export EVENT=approved_push
            fi
          fi
          python3 scripts/publish_reel.py 2>&1 | tee publish.log
      - name: 점검 결과 저장
        if: always() && github.event_name == 'push' && env.DRY_LOG == '1'
        run: |
          mkdir -p logs
          { echo "점검 시각(UTC): $(date -u +%FT%TZ)  결과: ${{ job.status }}"; cat publish.log 2>/dev/null; } > logs/last_dryrun.log
          git config user.name "canbly-bot"
          git config user.email "canbly-bot@users.noreply.github.com"
          git add logs/last_dryrun.log
          git commit -m "릴스 점검 결과" && git pull --rebase -q && git push
      - name: 실패 기록 저장
        if: failure() && env.DRY_LOG != '1'
        run: |
          mkdir -p logs
          { echo "릴스 실패 시각(UTC): $(date -u +%FT%TZ)  이벤트: ${{ github.event_name }}"; cat publish.log; } > logs/last_error.log
          git config user.name "canbly-bot"
          git config user.email "canbly-bot@users.noreply.github.com"
          git add logs/last_error.log
          git commit -m "릴스 발행 실패 기록" && git push
      - name: 발행 기록 저장
        run: |
          git config user.name "canbly-bot"
          git config user.email "canbly-bot@users.noreply.github.com"
          git add reels/*/published.json || true
          git diff --cached --quiet || (git commit -m "릴스 발행 기록" && git push)
